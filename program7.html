
<!DOCTYPE html>
<html>
<head>
<title>Year Calendar</title>
<style>
* { box-sizing: border-box; }
body {
    font-family: Arial;
    text-align: center;
    background: lightblue;
    margin: 0;
}
#enterPage {
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}
.enter-box, .month {
    background: white;
    padding: 20px;
    border-radius: 10px;
    box-shadow: 0 2px 8px #aaa;
}
.enter-box { width: 90%; max-width: 400px; }
input, button {
    padding: 12px;
    border-radius: 8px;
    font-size: 16px;
}
input { width: 100%; margin-bottom: 15px; }
button {
    background: #0077cc;
    color: white;
    border: none;
    cursor: pointer;
}
#error { color: red; }
#calendarPage { display: none; padding: 20px; }
#calendar {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 15px;
    padding: 20px;
}
.month h2 { color: #0077cc; }
table { width: 100%; border-collapse: collapse; }
th { color: #e63946; }
td, th { padding: 5px; text-align: center; }
td { border: 1px solid #eee; }
@media(max-width:700px) {
    #calendar { grid-template-columns: repeat(2,1fr); }
}
@media(max-width:450px) {
    #calendar { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div id="enterPage">
    <div class="enter-box">
        <h1>Year Calendar</h1>
        <input type="number" id="yearInput" placeholder="Enter Year">
        <button onclick="generateCalendar()">Generate Calendar</button>
        <p id="error"></p>
    </div>
</div>

<div id="calendarPage">
    <h1 id="yearTitle"></h1>
    <div id="calendar"></div>
    <button onclick="goBack()">Enter Another Year</button>
</div>

<script>
function generateCalendar() {
    let year = Number(document.getElementById("yearInput").value);
    let error = document.getElementById("error");

    if (!Number.isInteger(year) || year < 1000 || year > 9999) {
        error.textContent = "Enter a valid year (1000-9999)!";
        return;
    }

    error.textContent = "";
    let months = ["January","February","March","April","May","June",
                  "July","August","September","October","November","December"];
    let days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    let calendar = document.getElementById("calendar");

    calendar.innerHTML = "";
    document.getElementById("yearTitle").textContent = "Calendar - " + year;

    months.forEach((month, m) => {
        let first = new Date(year, m, 1).getDay();
        let total = new Date(year, m + 1, 0).getDate();
        let html = `<div class="month"><h2>${month} ${year}</h2><table><tr>`;

        days.forEach(day => html += `<th>${day}</th>`);
        html += "</tr><tr>";

        for (let i = 0; i < first; i++) html += "<td></td>";

        for (let d = 1; d <= total; d++) {
            html += `<td>${d}</td>`;
            if ((first + d) % 7 === 0 && d !== total) html += "</tr><tr>";
        }

        calendar.innerHTML += html + "</tr></table></div>";
    });

    document.getElementById("enterPage").style.display = "none";
    document.getElementById("calendarPage").style.display = "block";
}

function goBack() {
    document.getElementById("calendarPage").style.display = "none";
    document.getElementById("enterPage").style.display = "flex";
    document.getElementById("yearInput").value = "";
    document.getElementById("error").textContent = "";
}
</script>
</body>
</html>
