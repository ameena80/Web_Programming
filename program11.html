
<!DOCTYPE html>
<html>
<head>
<title>Registration Form</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, skyblue, purple);
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
}

.box {
    background: white;
    padding: 25px;
    width: 350px;
    border-radius: 10px;
}

h2 {
    text-align: center;
}

input {
    width: 100%;
    padding: 10px;
    margin: 8px 0;
    box-sizing: border-box;
}

button {
    width: 100%;
    padding: 10px;
    background: blue;
    color: white;
    border: none;
    cursor: pointer;
}

.error {
    color: red;
    font-size: 13px;
}
</style>
</head>

<body>

<div class="box">
<h2>Registration Form</h2>

<form id="form">

<label>Full Name</label>
<input type="text" id="name">
<span class="error" id="nameErr"></span>

<label>Email</label>
<input type="text" id="email">
<span class="error" id="emailErr"></span>

<label>Mobile Number</label>
<input type="text" id="mobile">
<span class="error" id="mobileErr"></span>

<label>Password</label>
<input type="password" id="password">
<span class="error" id="passErr"></span>

<label>Confirm Password</label>
<input type="password" id="confirm">
<span class="error" id="confirmErr"></span>

<button type="submit">Submit</button>

</form>
</div>

<script>

document.getElementById("form").onsubmit = function(e) {

    e.preventDefault();

    let name = document.getElementById("name").value;
    let email = document.getElementById("email").value;
    let mobile = document.getElementById("mobile").value;
    let pass = document.getElementById("password").value;
    let confirm = document.getElementById("confirm").value;

    let valid = true;

    if (!/^[A-Za-z ]{3,}$/.test(name)) {
        nameErr.innerHTML = "Enter valid name";
        valid = false;
    } else {
        nameErr.innerHTML = "";
    }

    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        emailErr.innerHTML = "Enter valid email";
        valid = false;
    } else {
        emailErr.innerHTML = "";
    }

    if (!/^[0-9]{10}$/.test(mobile)) {
        mobileErr.innerHTML = "Enter 10 digit number";
        valid = false;
    } else {
        mobileErr.innerHTML = "";
    }

    if (!/^(?=.*[A-Z])(?=.*[a-z])(?=.*[0-9])(?=.*[!@#$%^&*]).{6,}$/.test(pass)) {
        passErr.innerHTML = "Password must contain 6 characters, uppercase, lowercase, number and special character";
        valid = false;
    } else {
        passErr.innerHTML = "";
    }

    if (pass !== confirm || confirm === "") {
        confirmErr.innerHTML = "Password does not match";
        valid = false;
    } else {
        confirmErr.innerHTML = "";
    }

    if (valid) {
        document.body.innerHTML = `
            <div class="box">
                <h1 style="color:green;text-align:center">✓</h1>
                <h2>Submitted Successfully!</h2>
                <button onclick="location.reload()">Go Back</button>
            </div>
        `;
    }

};

</script>

</body>
</html>
